{% extends "base.html" %}
{% block title %}Log in — SmartBill Split{% endblock %}
{% block guest_content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo"><span style="width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block;transform:rotate(45deg);"></span> SmartBill Split</div>
    <div class="auth-sub">Split bills, settle up, pay instantly.</div>

    <a href="{{ url_for('auth.login_google') }}" class="oauth-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </a>
    <a href="{{ url_for('auth.login_phone_request') }}" class="oauth-btn">📱 Continue with Phone (OTP)</a>

    <div class="divider">or use email</div>

    <form method="POST">
      <label>Email address</label>
      <input type="email" name="email" required placeholder="you@example.com">
      <label>Password</label>
      <input type="password" name="password" required placeholder="••••••••">
      <button type="submit" class="btn btn-primary btn-block mt-3">Log in</button>
    </form>

    <p class="muted" style="margin-top:18px; font-size:0.85rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
